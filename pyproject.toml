[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confidante"
version = "0.1.0"
description = "Private CLI thought journal for emotional self-assessment"
authors = [{name = "Ajey", email = "ajeypie@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "plotext>=5.2.0",
    "networkx>=3.0",
]

[project.scripts]
confide = "confidante.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["confidante"]
